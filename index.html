<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact Book</title>
<meta name="theme-color" content="#1d4f91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Contacts">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{var d=document.documentElement,sk=localStorage.getItem("contactbook.skin");if(sk&&sk!=="classic")d.setAttribute("data-skin",sk);if(localStorage.getItem("contactbook.decor")==="1")d.setAttribute("data-decor","");if(localStorage.getItem("contactbook.font")==="clean")d.setAttribute("data-font","clean");}catch(e){}</script>
<style>
/* Layout: one-column phone app. Sticky header with search, list grouped by month met, bottom sheet for add/edit/detail. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#18202c; --muted:#5d6878; --line:#dde2ea;
  --accent:#1d4f91; --accent-ink:#ffffff; --chip:#eaf0f8; --danger:#b3261e; --flag:#c62828; --flag-bg:#fdecea;
  --title:var(--ink); --on-bg:var(--ink); --on-bg-muted:var(--muted); --fab-bg:var(--accent); --fab-ink:var(--accent-ink);
  --deco-fill:none; --deco-stroke:var(--accent); --deco-center:#f0b46a;
  --display:"Instrument Serif", Georgia, serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --surface:#18202b; --ink:#e8edf4; --muted:#9aa6b6; --line:#2a3442;
    --accent:#7fb0f0; --accent-ink:#0b1420; --chip:#1f2c3d; --danger:#ff8a80; --flag:#ff6b6b; --flag-bg:#3a1d20; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#18202b; --ink:#e8edf4; --muted:#9aa6b6; --line:#2a3442;
  --accent:#7fb0f0; --accent-ink:#0b1420; --chip:#1f2c3d; --danger:#ff8a80; --flag:#ff6b6b; --flag-bg:#3a1d20; color-scheme:dark;
}

/* Style themes: colours from the Olive Martini / Chocolate / Sky Blue palette. They override light and dark mode. */
:root[data-skin]{color-scheme:light}
:root[data-skin="atelier"]{--bg:#F4EFE4;--surface:#FFFDF8;--ink:#3D1900;--muted:#7A6450;--line:#E4DACB;--accent:#3D1900;--accent-ink:#FBF6EA;--chip:#E3EAFF;--danger:#A3261B;--flag:#B3261E;--flag-bg:#F8E1DC;
  --title:#3D1900;--on-bg:#3D1900;--on-bg-muted:#7A6450;--fab-bg:#A08D18;--fab-ink:#2A1400;--deco-fill:none;--deco-stroke:#3D1900;--deco-center:#CFDDFF}
:root[data-skin="olive"]{--bg:#A08D18;--surface:#FBF6EA;--ink:#2E2405;--muted:#6B5F3A;--line:#E3DCC4;--accent:#3D1900;--accent-ink:#FBF6EA;--chip:#EFE7C8;--danger:#A3261B;--flag:#B3261E;--flag-bg:#F8E1DC;
  --title:#FBF6EA;--on-bg:#2A1400;--on-bg-muted:#3D2A08;--fab-bg:#3D1900;--fab-ink:#FBF6EA;--deco-fill:none;--deco-stroke:#FBF6EA;--deco-center:#D9774B}
:root[data-skin="chocolate"]{--bg:#3D1900;--surface:#FBF6EA;--ink:#2A1200;--muted:#6E5A4A;--line:#E6DCCD;--accent:#3D1900;--accent-ink:#FBF6EA;--chip:#E3EAFF;--danger:#A3261B;--flag:#B3261E;--flag-bg:#F8E1DC;
  --title:#FBF6EA;--on-bg:#F1E6D6;--on-bg-muted:#CDB9A3;--fab-bg:#CFDDFF;--fab-ink:#3D1900;--deco-fill:#FBF6EA;--deco-stroke:#FBF6EA;--deco-center:#9DB3F0}
:root[data-skin="sky"]{--bg:#CFDDFF;--surface:#FFFFFF;--ink:#1B1A2B;--muted:#55597A;--line:#D9E0F5;--accent:#3D1900;--accent-ink:#FBF6EA;--chip:#EEF2FF;--danger:#A3261B;--flag:#B3261E;--flag-bg:#FBE3DF;
  --title:#1B1A2B;--on-bg:#1B1A2B;--on-bg-muted:#3F4566;--fab-bg:#3D1900;--fab-ink:#FBF6EA;--deco-fill:none;--deco-stroke:#1B1A2B;--deco-center:#F6EFC6}
:root[data-font="clean"]{--display:"IBM Plex Sans", system-ui, sans-serif}
:root[data-font="clean"] h1{font-weight:600;letter-spacing:-.5px;font-size:clamp(21px,6.4vw,27px)}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin:0 auto;min-height:100%;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 0 10px;display:grid;gap:10px}
.top{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:400 clamp(23px,7vw,30px)/1 var(--display);white-space:nowrap;margin:0;letter-spacing:.2px;color:var(--title);display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.search select{flex:none;width:36%;padding:11px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.status{font-size:12px;color:var(--on-bg-muted)}
.status .link{color:var(--on-bg)}
.group{margin-top:18px}
.group h2{font:600 12px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--on-bg-muted);margin:0 0 8px 2px}
.list{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{min-width:0;display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:0;text-align:left;width:100%;cursor:pointer}
.row:active{background:var(--chip)}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--accent);font:600 15px var(--body);object-fit:cover}
.av.lg{width:72px;height:72px;font-size:24px}
.photo-pick{display:flex;align-items:center;gap:14px}
.photo-pick .btns{display:flex;gap:8px;flex-wrap:wrap}
.form-head{position:sticky;top:-18px;z-index:2;background:var(--surface);margin:-18px -18px 14px;padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.form-head h3{flex:1;min-width:0;text-align:left;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.form-head .save-top{flex:0 0 auto;width:auto;padding:9px 20px}
.form-head .x{flex:0 0 auto}
.gal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 10px}
.gal-head span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.gal button{border:0;padding:0;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--chip);cursor:pointer}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal button{position:relative}
.gal button.sel{outline:3px solid var(--accent);outline-offset:-3px}
.gal button.sel::after{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 13px/22px var(--body);text-align:center}
.gal.selecting button:not(.sel) img{opacity:.75}
.gal-tools{display:flex;gap:8px}
.gal-bar{display:flex;gap:8px;margin:-6px 0 14px}
.gal-bar{flex-wrap:wrap}
.gal-bar .btn{padding:10px;min-width:0}
.gal-bar .btn:disabled{opacity:.45;cursor:default}
#g-prof{flex-basis:100%}
.picker{position:fixed;inset:0;z-index:45;background:rgba(10,15,25,.5);display:flex;align-items:flex-end;justify-content:center}
.picker-box{background:var(--surface);width:100%;max-width:640px;max-height:80%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.picker-box h3{font:400 24px/1.1 var(--display);margin:0}
.picker-box input{margin:12px 0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.picker-list{overflow-y:auto;display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px}
.picker-list .row{border-radius:0}
.name.flag,.d-name.flag{color:var(--flag)}
.flag-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--flag);background:var(--flag-bg);border-radius:999px;padding:4px 10px;margin:-6px 0 12px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer}
.switch .lbl{display:grid;gap:2px;color:var(--ink);font-size:14px;font-weight:600}
.switch .lbl small{color:var(--muted);font-weight:400;font-size:12px}
.switch input{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;margin:0;padding:0;border:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked{background:var(--flag)}
.switch input:checked::after{transform:translateX(18px)}
@media (prefers-reduced-motion: reduce){.switch input,.switch input::after{transition:none}}
.d-head{align-items:flex-start}
.d-head h3{flex:1;min-width:0;overflow-wrap:anywhere}
.d-btns{display:flex;gap:8px;flex:none}
.d-btns .edit-top{flex:none;padding:8px 16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:4px 0 12px}
.cols label{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px;font-weight:400;padding:6px 0;cursor:pointer}
.cols input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.col-links{display:flex;gap:14px;margin:0 0 6px;font-size:13px}
.scope{display:grid;gap:6px;margin:0 0 14px}
.scope label{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px;font-weight:400;cursor:pointer}
.scope input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.sub{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:6px 0 4px}
.flower{display:block}
.flower .pt{fill:var(--deco-fill);stroke:var(--deco-stroke);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.flower .ct{fill:var(--deco-center)}
.g-flower{display:none;width:16px;height:16px;flex:none}
:root[data-decor] .g-flower{display:inline-block}
.group h2{display:flex;align-items:center;gap:6px}
.empty .e-flower{display:none;width:96px;height:96px;margin:0 auto 10px}
:root[data-decor] .empty .e-flower{display:block}
.style-btn{width:36px;height:36px;padding:0;display:grid;place-items:center}
.style-btn svg{width:24px;height:24px}
.style-btn .pt{stroke:var(--accent);fill:none}
.style-btn .ct{fill:var(--accent)}
.skins{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:4px 0 16px}
.skin{border:2px solid var(--line);border-radius:14px;padding:0;overflow:hidden;cursor:pointer;background:none;text-align:left}
.skin[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.skin .sw{height:86px;display:flex;align-items:center;justify-content:center;position:relative}
.skin .sw .card{position:absolute;left:10px;right:10px;bottom:10px;height:16px;border-radius:5px}
.skin .sw svg{width:46px;height:46px;margin-top:-18px}
.skin .nm{display:block;padding:8px 10px;font-size:13px;font-weight:600;color:var(--ink);background:var(--surface)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 16px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{border-color:var(--ink)}
.seg .f1{font:400 22px/1 "Instrument Serif",Georgia,serif}
.seg .f2{font:600 19px/1 "IBM Plex Sans",system-ui,sans-serif}
.gal-note{font-size:13px;color:var(--muted);margin:0 0 14px}
.lb{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;color:#fff}
.lb-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.lb-top button,.lb-nav{border:0;border-radius:10px;padding:8px 12px;background:rgba(255,255,255,.14);color:#fff;font-weight:600;cursor:pointer}
.lb-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.lb-img img{max-width:100%;max-height:100%;object-fit:contain}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:22px;padding:10px 14px}
.lb-nav.prev{left:8px}.lb-nav.next{right:8px}
.lb-cap{padding:10px 12px calc(14px + env(safe-area-inset-bottom))}
.lb-cap input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
#f-av{cursor:pointer}
.update{position:fixed;left:16px;right:16px;top:calc(10px + env(safe-area-inset-top));z-index:30;max-width:608px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.update button{border:0;border-radius:8px;padding:7px 12px;font-weight:600;background:var(--accent-ink);color:var(--accent);cursor:pointer}
.small-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--accent)}
.phone-row{display:grid;grid-template-columns:minmax(0,44%) 1fr;gap:8px}
.d-top{display:flex;align-items:center;gap:14px;margin:-4px 0 14px}
.d-top .d-role{margin:0}
.who{min-width:0;flex:1;display:block;overflow:hidden}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{flex:0 1 auto;max-width:34%;font-size:12px;padding:4px 8px;border-radius:999px;background:var(--chip);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{margin-top:40px;text-align:center;color:var(--on-bg-muted)}
.empty strong{display:block;font:400 26px var(--display);color:var(--title);margin-bottom:6px}
.fab{position:fixed;right:max(16px, calc(50% - 304px));bottom:calc(20px + env(safe-area-inset-bottom));z-index:6;border:0;border-radius:16px;padding:14px 20px;background:var(--fab-bg);color:var(--fab-ink);font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:pointer}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:10;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:640px;margin:0 auto;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease}
.sheet.open{transform:none}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h3{font:400 26px/1.1 var(--display);margin:0;text-wrap:balance}
.x{border:0;background:var(--chip);border-radius:10px;padding:8px 12px;cursor:pointer}
form{display:grid;gap:12px}
label{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
form input,form textarea,form select{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:4px}
.btn{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.err{color:var(--danger);font-size:13px;min-height:1em}
/* detail */
.d-role{color:var(--muted);margin:-8px 0 14px}
.facts{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.fact{background:var(--surface);padding:11px 14px;display:grid;gap:2px}
.fact span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fact a{color:var(--accent);word-break:break-all}
.fact .val{word-break:break-word;white-space:pre-wrap}
.menu-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--accent)}
.top-r{display:flex;align-items:center;gap:6px;flex:none}
.top-r .menu-btn{padding:6px 10px}
.top-r .style-btn{padding:0;width:34px;height:32px}
:root[data-skin] .status .warn{color:var(--on-bg);font-weight:600}
.backup-note{font-size:13px;color:var(--muted);margin:0 0 14px}
.stack{display:grid;gap:10px}
.warn{color:var(--danger)}
.link{border:0;background:none;padding:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;z-index:20;display:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top"><h1>Contact Book</h1><div class="top-r"><button class="menu-btn style-btn" id="styleBtn" type="button" aria-label="Style and colours"><svg class="flower" viewBox="-50 -50 100 100" aria-hidden="true"><path class="pt" transform="rotate(0)" d="M0 -7 C 13.5 -14.0, 15.8 -32.0, 0.0 -40.0 C -15.0 -32.8, -12.8 -12.0, 0 -7 Z"/><path class="pt" transform="rotate(58)" d="M0 -7 C 15.6 -13.0, 14.6 -29.8, 1.8 -37.2 C -14.0 -30.5, -8.9 -11.2, 0 -7 Z"/><path class="pt" transform="rotate(122)" d="M0 -7 C 12.0 -14.6, 16.4 -33.3, -1.2 -41.6 C -15.6 -34.1, -15.3 -12.5, 0 -7 Z"/><path class="pt" transform="rotate(178)" d="M0 -7 C 15.0 -13.4, 15.1 -30.7, 1.2 -38.4 C -14.4 -31.5, -10.2 -11.5, 0 -7 Z"/><path class="pt" transform="rotate(238)" d="M0 -7 C 10.8 -14.3, 16.1 -32.6, -1.8 -40.8 C -15.3 -33.5, -16.0 -12.2, 0 -7 Z"/><path class="pt" transform="rotate(300)" d="M0 -7 C 13.8 -13.3, 15.0 -30.4, 0.6 -38.0 C -14.2 -31.2, -11.1 -11.4, 0 -7 Z"/><circle class="ct" cx="1" cy="0" r="8.5"/></svg></button><button class="menu-btn" id="excelBtn" type="button">Excel</button><button class="menu-btn" id="backupBtn" type="button">Backup</button></div></div>
    <div class="search">
      <input id="q" type="search" placeholder="Search name, title, notes…" aria-label="Search contacts">
      <select id="evFilter" aria-label="Filter by event"><option value="">All events</option></select>
    </div>
    <div class="status" id="status"></div>
  </header>
  <main id="main"></main>
</div>
<button class="fab" id="addBtn" type="button">+ Add contact</button>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const APP_VERSION="17";

let lastVisible=[];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
let contacts=[]; let db=null; let col=null; let mode="local";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials=n=>(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();

function linkedinUrl(v){v=(v||"").trim();if(!v)return"";if(/^https?:\/\//i.test(v))return v;if(/linkedin\.com/i.test(v))return"https://"+v.replace(/^\/+/,"");return"https://www.linkedin.com/in/"+v.replace(/^@/,"");}
function linkify(t){return esc(t||"").replace(/(https?:\/\/[^\s<]+|\b(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:com|cl|gal|es|it|org|net|io|sg|eu)(?:\/[^\s<]*)?)/gi,m=>`<a href="${/^https?:/i.test(m)?m:"https://"+m}" target="_blank" rel="noopener">${m}</a>`);}

const KEY="contactbook.contacts", BKEY="contactbook.lastBackup", PKEY="contactbook.pending", UKEY="contactbook.syncedUser";
let storageOk=true, sb=null, session=null, syncState="local", syncErr="";
try{if(SUPABASE_URL&&SUPABASE_KEY&&window.supabase)sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);}catch(e){sb=null}
function loadLocal(){try{contacts=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){contacts=[];storageOk=false}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(contacts));return true}catch(e){storageOk=false;return false}}
function getPending(){try{return JSON.parse(localStorage.getItem(PKEY)||"{}")}catch(e){return {}}}
function setPending(p){try{localStorage.setItem(PKEY,JSON.stringify(p))}catch(e){}}
function markPending(id,op){const p=getPending();p[id]=op;setPending(p);}
async function saveContact(c){
  const i=contacts.findIndex(x=>x.id===c.id);if(i>=0)contacts[i]=c;else contacts.push(c);
  if(!saveLocal())throw new Error("storage");
  markPending(c.id,"upsert");render();flush();
}
async function deleteContact(id){const old=contacts.find(c=>c.id===id);if(old)removeAllGallery(old);contacts=contacts.filter(c=>c.id!==id);saveLocal();markPending(id,"delete");render();flush();}
let flushing=null, flushAgain=false;
function flush(){
  if(!sb||!session)return Promise.resolve();
  if(flushing){flushAgain=true;return flushing;}
  flushing=(async()=>{do{flushAgain=false;await flushOnce();}while(flushAgain);flushing=null;updateStatus();})();
  return flushing;
}
async function flushOnce(){
  try{
    const p=getPending();
    for(const id of Object.keys(p)){
      let error;
      if(p[id]==="delete"){({error}=await sb.from("contacts").delete().eq("id",id));}
      else{const c=contacts.find(x=>x.id===id);if(!c){delete p[id];continue;}
        ({error}=await sb.from("contacts").upsert({id,user_id:session.user.id,data:c,updated_at:new Date(c.updatedAt||Date.now()).toISOString()}));}
      if(error)throw error;
      const now=getPending();delete now[id];setPending(now);
    }
    syncState="synced";syncErr="";
  }catch(e){syncState="pending";syncErr=e&&e.message||"";}
}
async function pull(){
  if(!sb||!session)return;
  const {data,error}=await sb.from("contacts").select("id,data");
  if(error){syncState="pending";syncErr=error.message;updateStatus();return;}
  const p=getPending();
  const remote=data.map(r=>({...r.data,id:r.id}));
  const keepLocal=contacts.filter(c=>p[c.id]==="upsert");
  const merged=remote.filter(r=>p[r.id]!=="delete"&&!keepLocal.some(k=>k.id===r.id)).concat(keepLocal);
  contacts=merged;saveLocal();render();
  if(Object.keys(p).length)flush();else{syncState="synced";updateStatus();}
}
async function onSignedIn(s){
  session=s;
  // First sync on this device for this account: upload what's already on the phone.
  let first=false;try{first=localStorage.getItem(UKEY)!==s.user.id}catch(e){}
  if(first){contacts.forEach(c=>markPending(c.id,"upsert"));try{localStorage.setItem(UKEY,s.user.id)}catch(e){}}
  await flush();await pull();
  try{sb.channel("contacts-live").on("postgres_changes",{event:"*",schema:"public",table:"contacts"},()=>pull()).subscribe();}catch(e){}
}
function initSync(){
  if(!sb){updateStatus();return;}
  sb.auth.getSession().then(({data})=>{if(data.session)onSignedIn(data.session);else{syncState="signedout";updateStatus();}});
  sb.auth.onAuthStateChange((ev,s)=>{
    if(ev==="SIGNED_IN"&&s&&(!session||session.user.id!==s.user.id))onSignedIn(s);
    if(ev==="SIGNED_OUT"){session=null;syncState="signedout";updateStatus();}
  });
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull();});
  window.addEventListener("online",()=>{flush();pull();});
}
function lastBackup(){try{return +localStorage.getItem(BKEY)||0}catch(e){return 0}}
function updateStatus(){
  const el=$("#status");
  if(!storageOk){el.innerHTML='<span class="warn">This browser is blocking storage, so contacts won\'t be kept. Turn off private browsing.</span>';return;}
  const n=contacts.length?contacts.length+" contact"+(contacts.length===1?"":"s")+" · ":"";
  if(sb&&session){
    const who=esc(session.user.email||"your account");
    if(syncState==="pending")el.innerHTML=n+`<span class="warn">waiting to sync</span> (offline?) · <button class="link" type="button" data-account>${who}</button>`;
    else el.innerHTML=n+`synced · <button class="link" type="button" data-account>${who}</button>`;
    return;
  }
  if(sb){el.innerHTML=n+'saved on this phone only · <button class="link" type="button" data-account>Sign in to sync</button>';return;}
  const lb=lastBackup();
  if(!contacts.length){el.textContent="Saved on this phone";return;}
  if(!lb){el.innerHTML=n+'saved on this phone · <span class="warn">no backup yet</span>';return;}
  const days=Math.floor((Date.now()-lb)/864e5);
  el.innerHTML=n+`last backup ${days===0?"today":days===1?"yesterday":days+" days ago"}${days>30?' <span class="warn">(time for a new one)</span>':""}`;
}
function openAccount(){
  if(session){
    openSheet(`<div class="sheet-head"><h3 id="sheetTitle">Sync</h3><button class="x" type="button" data-close>Close</button></div>

      <div class="stack"><button class="btn" type="button" id="a-sync">Sync now</button><button class="btn danger" type="button" id="a-out">Sign out</button></div>`);
    $("#a-sync").onclick=async()=>{await flush();await pull();toast("Synced");};
    $("#a-out").onclick=async()=>{await sb.auth.signOut();closeSheet();toast("Signed out");};
    return;
  }
  openSheet(`<div class="sheet-head"><h3 id="sheetTitle">Sign in to sync</h3><button class="x" type="button" data-close>Close</button></div>
    <p class="backup-note">Sign in to keep your contacts in your private online database, so they're on every device and safe if you lose your phone.</p>
    <form id="af" novalidate>

      <div class="actions"><button class="btn" type="button" id="a-up">Create account</button><button class="btn primary" type="submit">Sign in</button></div>
    </form>`);
  const creds=()=>({email:$("#a-email").value.trim(),password:$("#a-pass").value});
  $("#af").addEventListener("submit",async e=>{e.preventDefault();$("#a-err").textContent="";
    const {error}=await sb.auth.signInWithPassword(creds());
    if(error){$("#a-err").textContent=error.message.includes("confirm")?"Confirm your email first: open the link we sent you.":"Wrong email or password.";return;}
    closeSheet();toast("Signed in. Syncing…");});
  $("#a-up").onclick=async()=>{$("#a-err").textContent="";const c=creds();
    if(!c.email||c.password.length<6){$("#a-err").textContent="Enter your email and a password of at least 6 characters.";return;}
    const {data,error}=await sb.auth.signUp({...c,options:{emailRedirectTo:location.href.split("#")[0]}});
    if(error){$("#a-err").textContent=error.message;return;}
    if(!data.session)$("#a-err").textContent="Check your email and tap the confirmation link, then sign in here.";else{closeSheet();toast("Account created. Syncing…");}};
}

window.ContactBook={list:()=>contacts.slice(),upsert:async c=>{c.updatedAt=Date.now();c.createdAt=c.createdAt||Date.now();await saveContact(c);await flush();return c.id;},remove:async id=>{await deleteContact(id);await flush();},sync:async()=>{await flush();await pull();},signedIn:()=>!!session};

/* ---------- backup ---------- */
function stamp(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
async function deliverFile(name,text,type){
  const blob=new Blob([text],{type});
  try{
    const file=new File([blob],name,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true;}
  }catch(e){if(e&&e.name==="AbortError")return false;}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);return true;
}
async function exportBackup(){
  const ok=await deliverFile(`contact-book-backup-${stamp()}.json`,JSON.stringify({app:"contact-book",version:1,exportedAt:new Date().toISOString(),contacts},null,2),"application/json");
  if(ok){try{localStorage.setItem(BKEY,String(Date.now()))}catch(e){}updateStatus();toast("Backup saved");closeSheet();}
}
async function exportCSV(){
  const cols=["name","title","company","linkedin","phone","email","event","metMonth","metYear","notes"];
  const q=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const csv=[cols.join(",")].concat(contacts.map(c=>cols.map(k=>q(k==="linkedin"?linkedinUrl(c[k]):c[k])).join(","))).join("\n");
  const ok=await deliverFile(`contact-book-${stamp()}.csv`,"﻿"+csv,"text/csv");
  if(ok){toast("Spreadsheet exported");closeSheet();}
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{
    let data;try{data=JSON.parse(r.result)}catch(e){$("#b-err").textContent="That file isn't a Contact Book backup.";return;}
    const list=Array.isArray(data)?data:data.contacts;
    if(!Array.isArray(list)){$("#b-err").textContent="That file isn't a Contact Book backup.";return;}
    let added=0,updated=0;
    for(const c of list){
      if(!c||!c.name)continue;
      if(!c.id)c.id="c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      const i=contacts.findIndex(x=>x.id===c.id);
      if(i<0){contacts.push(c);added++;}
      else if((c.updatedAt||0)>(contacts[i].updatedAt||0)){contacts[i]=c;updated++;}
    }
    saveLocal();list.forEach(c=>{if(c&&c.id)markPending(c.id,"upsert");});flush();render();closeSheet();
    toast(`Restored: ${added} added, ${updated} updated`);
  };
  r.readAsText(file);
}
function openBackup(){
  openSheet(`
    <div class="sheet-head"><h3 id="sheetTitle">Backup</h3><button class="x" type="button" data-close>Close</button></div>
    <p class="backup-note">App version ${APP_VERSION}. Your contacts live only on this phone. Save a backup now and then, to Files, iCloud Drive, Google Drive or by emailing it to yourself, so you can restore them on a new phone.</p>

}

const EXCEL_COLS=[
  ["name","Name",c=>c.name||""],["title","Professional title",c=>c.title||""],["company","Company",c=>c.company||""],
  ["linkedin","LinkedIn",c=>linkedinUrl(c.linkedin)],["phone","Phone",c=>c.phone||""],["email","Email",c=>c.email||""],
  ["event","Event / conference",c=>c.event||""],["met","When met",c=>c.metYear?metLabel(c):""],
  ["health","Health / close to my PhD",c=>c.health?"Yes":""],["notes","Notes",c=>c.notes||""],
  ["photos","Photos & slides",c=>{const n=Array.isArray(c.gallery)?c.gallery.length:0;return n?n:"";}]];
const DEFAULT_COLS=["name","title","company","linkedin","phone","email","event","met","notes"];
function savedCols(){try{const v=JSON.parse(localStorage.getItem("contactbook.excelCols"));if(Array.isArray(v)&&v.length)return v;}catch(e){}return DEFAULT_COLS;}
function loadXLSX(){
  if(window.XLSX)return Promise.resolve();
  return new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";sc.onload=res;sc.onerror=()=>rej(new Error("lib"));document.head.appendChild(sc);});
}
function openExcel(){
  const chosen=new Set(savedCols());
  const filtered=lastVisible.length!==contacts.length;
  openSheet(`<div class="sheet-head"><h3 id="sheetTitle">Download as Excel</h3><button class="x" type="button" data-close>Close</button></div>
    <p class="sub">Columns to include</p>
    <div class="col-links"><button class="link" type="button" id="x-all">Select all</button><button class="link" type="button" id="x-none">Clear</button></div>
    <div class="cols">${EXCEL_COLS.map(([k,l])=>`<label for="x-${k}"><input type="checkbox" id="x-${k}" value="${k}" ${chosen.has(k)?"checked":""}>${esc(l)}</label>`).join("")}</div>
    <p class="sub">Which contacts</p>
    <div class="scope"><label for="x-sall"><input type="radio" name="xscope" id="x-sall" value="all" ${filtered?"":"checked"}>All contacts (${contacts.length})</label>
      <label for="x-sview"><input type="radio" name="xscope" id="x-sview" value="view" ${filtered?"checked":""} ${filtered?"":"disabled"}>Only the ones shown now (${lastVisible.length})${filtered?"":" · use search or the filter first"}</label></div>
    <div class="err" id="x-err"></div>
    <div class="actions"><button class="btn primary" type="button" id="x-go">Download Excel file</button></div>`);
  const boxes=()=>[...document.querySelectorAll('.cols input')];
  $("#x-all").onclick=()=>boxes().forEach(b=>b.checked=true);
  $("#x-none").onclick=()=>boxes().forEach(b=>b.checked=false);
  $("#x-go").onclick=async()=>{
    const keys=boxes().filter(b=>b.checked).map(b=>b.value);
    if(!keys.length){$("#x-err").textContent="Pick at least one column.";return;}
    const rows=($("#x-sview").checked?lastVisible:contacts.slice().sort((a,b)=>metKey(b)-metKey(a)||(a.name||"").localeCompare(b.name||"")));
    if(!rows.length){$("#x-err").textContent="There are no contacts to export.";return;}
    try{localStorage.setItem("contactbook.excelCols",JSON.stringify(keys))}catch(e){}
    const btn=$("#x-go");btn.disabled=true;btn.textContent="Preparing…";
    try{
      await loadXLSX();
      const cols=EXCEL_COLS.filter(c=>keys.includes(c[0]));
      const aoa=[cols.map(c=>c[1])].concat(rows.map(r=>cols.map(c=>c[2](r))));
      const ws=XLSX.utils.aoa_to_sheet(aoa);
      const li=cols.findIndex(c=>c[0]==="linkedin");
      if(li>=0)rows.forEach((r,i)=>{const ref=XLSX.utils.encode_cell({r:i+1,c:li});const u=linkedinUrl(r.linkedin);if(u&&ws[ref])ws[ref].l={Target:u};});
      ws["!cols"]=cols.map((c,ci)=>({wch:Math.min(60,Math.max(c[1].length,...aoa.slice(1).map(row=>String(row[ci]).split("\n")[0].length))+2)}));
      ws["!autofilter"]={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length,c:cols.length-1}})};
      const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Contacts");
      const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
      const ok=await deliverFile(`contacts-${stamp()}.xlsx`,buf,"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
      if(ok){closeSheet();toast(`Excel file with ${rows.length} contact${rows.length===1?"":"s"} ready`);return;}
    }catch(e){$("#x-err").textContent="Couldn't create the file. Check your internet connection the first time you use this, then try again.";}
    btn.disabled=false;btn.textContent="Download Excel file";
  };
}
$("#excelBtn").addEventListener("click",openExcel);

const flag=iso=>String.fromCodePoint(...[...iso].map(ch=>127397+ch.charCodeAt(0)));
const PREFERRED_ORDER={US:1,CA:2,RU:1,KZ:2}; // which country wins when a prefix is shared
function splitPhone(phone,iso){
  phone=(phone||"").trim();
  if(iso){const c=COUNTRIES.find(x=>x[0]===iso);if(c&&phone.replace(/\s/g,"").startsWith("+"+c[2]))return {iso,num:phone.replace(/^\s*\+\s*/, "").slice(c[2].length).trim()};}
  if(phone.startsWith("+")){
    const digits=phone.slice(1).replace(/\D/g,"");
    const m=COUNTRIES.filter(c=>digits.startsWith(c[2])).sort((a,b)=>b[2].length-a[2].length||(PREFERRED_ORDER[a[0]]||9)-(PREFERRED_ORDER[b[0]]||9))[0];
    if(m){let rest=phone.slice(1).trim();let need=m[2].length;let i=0;while(need>0&&i<rest.length){if(/\d/.test(rest[i]))need--;i++;}return {iso:m[0],num:rest.slice(i).trim()};}
  }
  return {iso:null,num:phone};
}
function lastIso(){try{return localStorage.getItem("contactbook.lastCountry")||"IT"}catch(e){return "IT"}}
function countryOptions(sel){return COUNTRIES.map(([iso,name,code])=>`<option value="${iso}" ${iso===sel?"selected":""}>${flag(iso)} +${code} ${esc(name)}</option>`).join("");}

/* ---------- photos ---------- */
const safePhoto=p=>typeof p==="string"&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p)?p:"";
function avatar(c,cls=""){const p=safePhoto(c.photo);return p?`<img class="av ${cls}" src="${p}" alt="">`:`<span class="av ${cls}">${esc(initials(c.name))}</span>`;}
function resizeImage(file,size=192){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{const s=Math.min(img.naturalWidth,img.naturalHeight);const cv=document.createElement("canvas");cv.width=cv.height=size;
      const ctx=cv.getContext("2d");ctx.drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,size,size);
      URL.revokeObjectURL(url);resolve(cv.toDataURL("image/jpeg",0.82));};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("image"));};img.src=url;});
}

/* ---------- event photos & slides ---------- */
const BUCKET="contact-photos"; const urlCache={};
function cleanGallery(c){const uid=session&&session.user.id;return (Array.isArray(c.gallery)?c.gallery:[]).filter(g=>g&&typeof g.p==="string"&&/^[\w-]+\/[\w-]+\/[\w-]+$/.test(g.p)&&(!uid||g.p.startsWith(uid+"/")));}
async function signedUrls(paths){
  const need=paths.filter(p=>!urlCache[p]||urlCache[p].exp<Date.now()+120000);
  if(need.length){const {data,error}=await sb.storage.from(BUCKET).createSignedUrls(need,3600);
    if(!error)data.forEach(d=>{if(d.signedUrl)urlCache[d.path]={url:d.signedUrl,exp:Date.now()+3600e3};});}
  return paths.map(p=>urlCache[p]?urlCache[p].url:"");
}
function resizeToBlob(file,max,quality){
  return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const cv=document.createElement("canvas");
      cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);cv.toBlob(b=>b?resolve(b):reject(new Error("image")),"image/jpeg",quality);};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("image"));};img.src=url;});
}
async function addGalleryPhotos(id,files,onProgress){
  const c=contacts.find(x=>x.id===id);if(!c)return;
  const added=[];let i=0;
  for(const f of files){i++;onProgress&&onProgress(i,files.length);
    const key=`${session.user.id}/${c.id.replace(/[^\w-]/g,"")}/${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`;
    const [full,thumb]=await Promise.all([resizeToBlob(f,1800,.85),resizeToBlob(f,420,.75)]);
    let r=await sb.storage.from(BUCKET).upload(key+".jpg",full,{contentType:"image/jpeg"});if(r.error)throw r.error;
    r=await sb.storage.from(BUCKET).upload(key+"_t.jpg",thumb,{contentType:"image/jpeg"});if(r.error)throw r.error;
    added.push({p:key,cap:"",at:Date.now()});}
  const fresh=contacts.find(x=>x.id===id);
  const next={...fresh,gallery:cleanGallery(fresh).concat(added),updatedAt:Date.now()};
  await saveContact(next);await flush();
}
async function removeGalleryPhoto(id,p){
  const c=contacts.find(x=>x.id===id);if(!c)return;
  await sb.storage.from(BUCKET).remove([p+".jpg",p+"_t.jpg"]);
  await saveContact({...c,gallery:cleanGallery(c).filter(g=>g.p!==p),updatedAt:Date.now()});await flush();
}
async function removeGalleryPhotos(id,paths){
  const c=contacts.find(x=>x.id===id);if(!c||!paths.length)return;
  const r=await sb.storage.from(BUCKET).remove(paths.flatMap(p=>[p+".jpg",p+"_t.jpg"]));if(r.error)throw r.error;
  await saveContact({...c,gallery:cleanGallery(c).filter(g=>!paths.includes(g.p)),updatedAt:Date.now()});await flush();
}
async function moveGalleryPhotos(fromId,toId,paths){
  const from=contacts.find(x=>x.id===fromId),to=contacts.find(x=>x.id===toId);if(!from||!to||!paths.length)return;
  const moving=cleanGallery(from).filter(g=>paths.includes(g.p));
  await saveContact({...from,gallery:cleanGallery(from).filter(g=>!paths.includes(g.p)),updatedAt:Date.now()});
  await saveContact({...to,gallery:cleanGallery(to).concat(moving),updatedAt:Date.now()});await flush();
}
function pickContact(excludeId,title){
  return new Promise(resolve=>{
    const ov=document.createElement("div");ov.className="picker";
    ov.innerHTML=`<div class="picker-box" role="dialog" aria-label="${esc(title)}"><div class="sheet-head" style="margin:0"><h3>${esc(title)}</h3><button class="x" type="button" data-pc>Cancel</button></div>
      <input type="search" placeholder="Search contacts…" aria-label="Search contacts"><div class="picker-list"></div></div>`;
    document.body.appendChild(ov);
    const list=ov.querySelector(".picker-list"),q=ov.querySelector("input");
    const draw=()=>{const v=q.value.trim().toLowerCase();
      const items=contacts.filter(c=>c.id!==excludeId&&(!v||[c.name,c.company,c.event].join(" ").toLowerCase().includes(v))).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
      list.innerHTML=items.length?items.map(c=>`<button class="row" type="button" data-to="${esc(c.id)}">${avatar(c)}<span class="who"><div class="name${c.health?" flag":""}">${esc(c.name)}</div><div class="role">${esc([c.title,c.company].filter(Boolean).join(" · ")||"")}</div></span></button>`).join(""):'<div class="row" style="cursor:default;color:var(--muted)">No other contacts match.</div>';};
    const done=v=>{ov.remove();document.removeEventListener("keydown",key,true);resolve(v);};
    const key=e=>{if(e.key==="Escape"){e.stopPropagation();done(null);}};
    document.addEventListener("keydown",key,true);
    q.oninput=draw;ov.onclick=e=>{if(e.target===ov||e.target.closest("[data-pc]"))return done(null);const b=e.target.closest("[data-to]");if(b)done(b.dataset.to);};
    draw();
  });
}

let galSel=new Set(),galSelecting=false;
function setSelecting(on){galSelecting=on;if(!on)galSel.clear();
  const box=$("#gal");if(!box)return;box.classList.toggle("selecting",on);
  box.querySelectorAll("[data-p]").forEach(b=>{b.classList.toggle("sel",galSel.has(b.dataset.p));b.setAttribute("aria-pressed",galSel.has(b.dataset.p));});
  const n=galSel.size;$("#g-sel").textContent=on?"Done":"Select";$("#g-add").hidden=on;
  $("#g-title").textContent=on?(n?`${n} selected`:"Tap photos to select"):"Photos & slides";
  $("#g-bar").hidden=!on;$("#g-move").disabled=!n;$("#g-prof").disabled=n!==1;$("#g-del").disabled=!n;$("#g-del").textContent=n?`Delete (${n})`:"Delete";$("#g-del").dataset.confirm="";}
async function fillGallery(id){
  const box=$("#gal"),head=$("#gal-status");if(!box)return;
  const c=contacts.find(x=>x.id===id);if(!c)return;
  if(!sb||!session){box.innerHTML="";$("#gal-note").textContent="Sign in to sync to add photos and slides from the event.";$("#g-add").hidden=true;return;}
  const g=cleanGallery(c);
  if(!g.length){const sb2=$("#g-sel");if(sb2)sb2.hidden=true;setSelecting(false);box.innerHTML="";$("#gal-note").textContent="No photos yet. Add photos from the event or pictures of their slides.";return;}
  $("#gal-note").textContent="";
  const selBtn=$("#g-sel");if(selBtn)selBtn.hidden=false;
  box.innerHTML=g.map((x,i)=>`<button type="button" data-gi="${i}" data-p="${x.p}" class="${galSel.has(x.p)?"sel":""}" aria-label="Photo ${i+1}" aria-pressed="${galSel.has(x.p)}"><img alt=""></button>`).join("");
  const urls=await signedUrls(g.map(x=>x.p+"_t.jpg"));
  box.querySelectorAll("img").forEach((im,i)=>{if(urls[i])im.src=urls[i];});
}
function openLightbox(id,start){
  const c=contacts.find(x=>x.id===id);let g=cleanGallery(c);if(!g.length)return;let i=start;
  const lb=document.createElement("div");lb.className="lb";lb.setAttribute("role","dialog");lb.setAttribute("aria-label","Photo viewer");
  lb.innerHTML=`<div class="lb-top"><button type="button" data-x>Close</button><span id="lb-n"></span><span style="display:flex;gap:8px"><button type="button" data-mv>Move</button><button type="button" data-rm>Delete</button></span></div>
    <div class="lb-img"><img id="lb-im" alt=""><button class="lb-nav prev" type="button" aria-label="Previous">‹</button><button class="lb-nav next" type="button" aria-label="Next">›</button></div>
    <div class="lb-cap"><input id="lb-cap" placeholder="Add a caption, e.g. their slide on river restoration" aria-label="Caption"></div>`;
  document.body.appendChild(lb);
  const show=async()=>{const x=g[i];lb.querySelector("#lb-n").textContent=`${i+1} / ${g.length}`;
    lb.querySelector("#lb-cap").value=x.cap||"";const rm=lb.querySelector("[data-rm]");rm.textContent="Delete";rm.dataset.confirm="";
    lb.querySelector(".prev").hidden=i===0;lb.querySelector(".next").hidden=i===g.length-1;
    const im=lb.querySelector("#lb-im");im.removeAttribute("src");const [u]=await signedUrls([x.p+".jpg"]);if(g[i]===x&&u)im.src=u;};
  const saveCap=async()=>{const v=lb.querySelector("#lb-cap").value.trim();if((g[i].cap||"")===v)return;
    const cur=contacts.find(x=>x.id===id);const gg=cleanGallery(cur).map(x=>x.p===g[i].p?{...x,cap:v}:x);g=gg;
    await saveContact({...cur,gallery:gg,updatedAt:Date.now()});};
  const close=async()=>{await saveCap();lb.remove();document.removeEventListener("keydown",key,true);fillGallery(id);};
  const go=async d=>{await saveCap();i=Math.max(0,Math.min(g.length-1,i+d));show();};
  const key=e=>{if(e.key==="Escape"){e.stopPropagation();close();}if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1);};
  document.addEventListener("keydown",key,true);
  lb.querySelector("[data-x]").onclick=close;lb.querySelector(".prev").onclick=()=>go(-1);lb.querySelector(".next").onclick=()=>go(1);
  lb.querySelector("#lb-cap").addEventListener("change",saveCap);
  lb.querySelector("[data-mv]").onclick=async()=>{await saveCap();const to=await pickContact(id,"Move photo to…");if(!to)return;
    try{await moveGalleryPhotos(id,to,[g[i].p]);const name=(contacts.find(x=>x.id===to)||{}).name||"contact";toast(`Moved to ${name}`);
      g=cleanGallery(contacts.find(x=>x.id===id));if(!g.length){lb.remove();document.removeEventListener("keydown",key,true);fillGallery(id);return;}i=Math.min(i,g.length-1);show();}
    catch(_){toast("Couldn't move the photo. Try again.");}};
  lb.querySelector("[data-rm]").onclick=async e=>{const b=e.currentTarget;if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Tap again to delete";return;}
    b.textContent="Deleting…";try{await removeGalleryPhoto(id,g[i].p);g=cleanGallery(contacts.find(x=>x.id===id));
      if(!g.length){lb.remove();document.removeEventListener("keydown",key,true);fillGallery(id);return;}i=Math.min(i,g.length-1);show();}
    catch(_){b.textContent="Couldn't delete. Try again";b.dataset.confirm="";}};
  let sx=null;const area=lb.querySelector(".lb-img");
  area.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;},{passive:true});
  area.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)go(dx<0?1:-1);});
  show();
}

/* ---------- list ---------- */
function render(){
  updateStatus();
  const q=$("#q").value.trim().toLowerCase(), ev=$("#evFilter").value;
  const events=[...new Set(contacts.map(c=>(c.event||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const sel=$("#evFilter");const cur=sel.value;
  sel.innerHTML='<option value="">All events</option><option value="__health">Health · close to my PhD</option>'+events.map(e=>`<option value="${esc(e)}">${esc(e)}</option>`).join("");
  sel.value=events.includes(cur)||cur==="__health"?cur:"";
  let list=contacts.filter(c=>{
    if(sel.value==="__health"){if(!c.health)return false;}else if(sel.value&&(c.event||"").trim()!==sel.value)return false;
    if(!q)return true;
    return [c.name,c.title,c.company,c.event,c.notes,c.phone,c.email].join(" ").toLowerCase().includes(q);
  }).sort((a,b)=>metKey(b)-metKey(a)||(a.name||"").localeCompare(b.name||""));
  lastVisible=list;
  const main=$("#main");
  if(!contacts.length){main.innerHTML=`<div class="empty"><div class="e-flower">${FLOWER_SVG}</div><strong>No contacts yet</strong>Tap “Add contact” after your next event.</div>`;return;}
  if(!list.length){main.innerHTML=`<div class="empty"><strong>No matches</strong>Try a different search or event.</div>`;return;}
  const groups=[];let last=null;
  for(const c of list){const k=metLabel(c);if(k!==last){groups.push({k,items:[]});last=k;}groups[groups.length-1].items.push(c);}
  main.innerHTML=groups.map(g=>`<div class="group"><h2><span class="g-flower">${FLOWER_SVG}</span>Met ${esc(g.k==="Date not set"?"· date not set":g.k)}</h2><div class="list">${g.items.map(c=>`
    <button class="row" type="button" data-id="${esc(c.id)}">
      ${avatar(c)}
      <span class="who"><div class="name${c.health?" flag":""}">${esc(c.name)}</div><div class="role">${esc([c.title,c.company].filter(Boolean).join(" · ")||"No title")}</div></span>
      ${c.event?`<span class="ev">${esc(c.event)}</span>`:""}
    </button>`).join("")}</div></div>`).join("");
}

    try{await moveGalleryPhotos(c.id,to,paths);toast(`Moved to ${(contacts.find(x=>x.id===to)||{}).name||"contact"}`);}catch(_){toast("Couldn't move the photos. Try again.");}
    setSelecting(false);fillGallery(c.id);};
  $("#g-del").onclick=async e=>{const b=e.currentTarget;const paths=[...galSel];if(!paths.length)return;
    if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent=`Tap again to delete ${paths.length}`;return;}
    b.textContent="Deleting…";try{await removeGalleryPhotos(c.id,paths);toast(paths.length===1?"Photo deleted":`${paths.length} photos deleted`);}catch(_){toast("Couldn't delete. Try again.");}
    setSelecting(false);fillGallery(c.id);};
  $("#g-file").onchange=async e=>{const files=[...e.target.files];e.target.value="";if(!files.length)return;
    const btn=$("#g-add");btn.disabled=true;
    try{await addGalleryPhotos(c.id,files,(n,t)=>{btn.textContent=`Uploading ${n} of ${t}…`;});toast(files.length===1?"Photo added":`${files.length} photos added`);}
    catch(err){toast("Upload failed. Check your connection and try again.");}
    btn.disabled=false;btn.textContent="Add photos";fillGallery(c.id);};
}
function openForm(id){
  const c=contacts.find(x=>x.id===id)||{};
  const now=new Date();
  const m=c.metMonth??(id?"":now.getMonth()+1), y=c.metYear??(id?"":now.getFullYear());
  const events=[...new Set(contacts.map(x=>x.event).filter(Boolean))];
  const ph=splitPhone(c.phone,c.phoneCountry);
  let photo=safePhoto(c.photo);
  openSheet(`
    <div class="sheet-head form-head"><h3 id="sheetTitle">${id?"Edit contact":"New contact"}</h3><button class="btn primary save-top" type="submit" form="f">Save</button></div>
    <form id="f" novalidate>
      <div class="photo-pick"><span id="f-av">${avatar(c,"lg")}</span>
        <div class="btns"><button class="small-btn" type="button" id="f-photo-lbl">${safePhoto(c.photo)?"Change photo":"Add photo"}</button>
        <button class="small-btn" type="button" id="f-photo-rm" ${safePhoto(c.photo)?"":"hidden"}>Remove</button></div>
        <input id="f-photo" class="vh" type="file" accept="image/*"></div>
      <label for="f-name">Full name *<input id="f-name" name="name" required autocomplete="off" value="${esc(c.name)}"></label>
      <div class="two">
        <label for="f-title">Professional title<input id="f-title" name="title" value="${esc(c.title)}" placeholder="Head of Partnerships"></label>
        <label for="f-company">Company<input id="f-company" name="company" value="${esc(c.company)}"></label>
      </div>
      <label for="f-li">LinkedIn<input id="f-li" name="linkedin" inputmode="url" autocapitalize="off" value="${esc(c.linkedin)}" placeholder="linkedin.com/in/username"></label>
      <div><label for="f-phone">Phone</label>
        <div class="phone-row"><select id="f-cc" name="phoneCountry" aria-label="Country code"><option value="">No prefix</option>${countryOptions(ph.iso||(c.phone?"":lastIso()))}</select>
        <input id="f-phone" name="phone" type="tel" inputmode="tel" value="${esc(ph.num)}" placeholder="333 123 4567"></div></div>
      <label for="f-email">Email<input id="f-email" name="email" type="email" autocapitalize="off" value="${esc(c.email)}" placeholder="name@company.com"></label>
      <label for="f-event">Event or conference<input id="f-event" name="event" list="evlist" value="${esc(c.event)}" placeholder="Web Summit Lisbon"></label>
      <datalist id="evlist">${events.map(e=>`<option value="${esc(e)}"></option>`).join("")}</datalist>
      <div class="two">
        <label for="f-month">Month met<select id="f-month" name="metMonth"><option value="">—</option>${MONTHS.map((n,i)=>`<option value="${i+1}" ${+m===i+1?"selected":""}>${n}</option>`).join("")}</select></label>
        <label for="f-year">Year met<input id="f-year" name="metYear" type="number" inputmode="numeric" min="1950" max="2100" value="${esc(y)}"></label>
      </div>
      <label class="switch" for="f-health"><span class="lbl">Works in health / close to my PhD<small>Health department, hospital, public health or similar. Their name shows in red.</small></span><input id="f-health" name="health" type="checkbox" role="switch" ${c.health?"checked":""}></label>
      <label for="f-notes">Notes<textarea id="f-notes" name="notes" placeholder="What you talked about, follow-ups, mutual contacts…">${esc(c.notes)}</textarea></label>
      <div class="err" id="f-err"></div>
      <div class="actions">${id?`<button class="btn danger" type="button" data-del="${esc(id)}">Delete contact</button>`:""}<button class="btn" type="button" data-close>Discard changes</button></div>
    </form>`);
  const refreshAv=()=>{$("#f-av").innerHTML=avatar({name:$("#f-name").value||c.name,photo});$("#f-photo-rm").hidden=!photo;$("#f-photo-lbl").textContent=photo?"Change photo":"Add photo";};
  $("#f-photo").onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{photo=await resizeImage(f);refreshAv();}catch(_){$("#f-err").textContent="That image couldn't be opened. Try a JPEG or PNG.";}};
  $("#f-photo-rm").onclick=()=>{photo="";refreshAv();};
  $("#f-photo-lbl").onclick=()=>$("#f-photo").click();
  $("#f-av").onclick=()=>$("#f-photo").click();
  $("#f").addEventListener("submit",async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);const o=Object.fromEntries([...fd].map(([k,v])=>[k,String(v).trim()]));
    if(!o.name){$("#f-err").textContent="Add a name to save this contact.";$("#f-name").focus();return;}
    const rec={id:id||("c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),name:o.name,title:o.title,company:o.company,linkedin:o.linkedin,phone:(()=>{const n=o.phone.replace(/^\+/,"");if(!o.phone)return "";if(o.phone.startsWith("+")||!o.phoneCountry)return o.phone;const cc=COUNTRIES.find(x=>x[0]===o.phoneCountry);return "+"+cc[2]+" "+(["IT","SM"].includes(cc[0])?n:n.replace(/^0(?=\d)/,""));})(),
      phoneCountry:o.phone?o.phoneCountry:"",photo,gallery:c.gallery||[],health:!!e.target.querySelector("#f-health").checked,email:o.email,event:o.event,
      metMonth:o.metMonth?+o.metMonth:null,metYear:o.metYear?+o.metYear:null,notes:o.notes,updatedAt:Date.now(),createdAt:c.createdAt||Date.now()};
    if(o.phoneCountry){try{localStorage.setItem("contactbook.lastCountry",o.phoneCountry)}catch(_){}}
    try{await saveContact(rec);closeSheet();toast(id?"Contact updated":"Contact saved");}
    catch(err){$("#f-err").textContent="Couldn't save. Check your connection and try again.";}
  });
}
sheet.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.hasAttribute("data-close"))closeSheet();
  else if(t.dataset.edit)openForm(t.dataset.edit);
  else if(t.dataset.copy){try{await navigator.clipboard.writeText(t.dataset.copy);toast("Number copied");}catch(_){toast("Copy not allowed here");}}
  else if(t.dataset.del){
    if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent="Tap again to delete";return;}
    try{await deleteContact(t.dataset.del);closeSheet();toast("Contact deleted");}catch(_){$("#f-err").textContent="Couldn't delete. Try again.";}
  }
});
$("#addBtn").addEventListener("click",()=>openForm(null));

loadLocal();render();initSync();
async function checkUpdate(){
  try{const t=await fetch("./index.html?check="+Date.now(),{cache:"no-store"}).then(r=>r.text());const m=t.match(/APP_VERSION="(\d+)"/);
    if(m&&m[1]!==APP_VERSION&&!document.querySelector(".update")){const d=document.createElement("div");d.className="update";
      d.innerHTML='<span>A new version of the app is ready.</span><button type="button">Update</button>';
      d.querySelector("button").onclick=async()=>{try{const r=await navigator.serviceWorker?.getRegistration();await r?.update();}catch(_){}location.reload();};
      document.body.appendChild(d);}}catch(_){}
}
checkUpdate();document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpdate();});
// Ask the browser not to clear our data when space runs low.
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{});}
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}));}
</script>
